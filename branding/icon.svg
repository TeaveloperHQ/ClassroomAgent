<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Teavel 브랜드 그라데이션 (indigo → violet → cyan) -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="50%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- 라운드 사각형 배경 (Teavel 표준 rx 비율 22%) -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#g)"/>

  <!-- X자로 교차하는 쇠사슬 두 줄. 각 링크 = 회전된 타원 링(흰 stroke).
       Chain 1 (\ 방향): 중앙 링을 비워 Chain 2가 위로 지나가는 것처럼 보이게 함.
       Chain 2 (/ 방향): 중앙 링 포함, 5고리. -->

  <g stroke="#ffffff" stroke-width="34" fill="none" stroke-linecap="round">
    <!-- Chain 1: 좌상 → 우하 (\), 중앙(512,512) 비움 -->
    <ellipse cx="285" cy="285" rx="76" ry="42" transform="rotate(45 285 285)"/>
    <ellipse cx="398" cy="398" rx="76" ry="42" transform="rotate(45 398 398)"/>
    <ellipse cx="626" cy="626" rx="76" ry="42" transform="rotate(45 626 626)"/>
    <ellipse cx="739" cy="739" rx="76" ry="42" transform="rotate(45 739 739)"/>

    <!-- Chain 2: 우상 → 좌하 (/), 중앙 포함 5고리 (Chain 1 위로 지남) -->
    <ellipse cx="739" cy="285" rx="76" ry="42" transform="rotate(-45 739 285)"/>
    <ellipse cx="626" cy="398" rx="76" ry="42" transform="rotate(-45 626 398)"/>
    <ellipse cx="512" cy="512" rx="76" ry="42" transform="rotate(-45 512 512)"/>
    <ellipse cx="398" cy="626" rx="76" ry="42" transform="rotate(-45 398 626)"/>
    <ellipse cx="285" cy="739" rx="76" ry="42" transform="rotate(-45 285 739)"/>
  </g>
</svg>
